<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IPTV Playlist Checker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h1>📺 IPTV Playlist Checker</h1>
    <div id="controls">
        <input type="file" id="file" accept=".m3u" />
        <input type="text" id="playlisturl" placeholder="Enter playlist URL" style="width:320px;" />
        <button id="check">Check (File/URL)</button>
        <button id="clear">Clear</button>
        <button id="dl">Download Active</button>
    </div>

    <!-- textarea используется как "manual m3u" -->
    <textarea id="manualm3u">#EXTM3U
#EXTINF:-1, Example Online Channel
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1, Example Offline Channel
https://nonexistent-domain-iptv.test/stream.m3u8</textarea>

    <div id="scind">Status: Ready / Waiting for file...</div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Status</th>
                <th>Code</th>
                <th>Play</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="player-container">
        <h3>▶️ Now Playing: <span id="current-channel-name"></span></h3>
        <video id="video-player" controls autoplay></video>
        <div id="nav-buttons">
            <button id="prev">⏮ Prev</button>
            <button id="next">⏭ Next</button>
        </div>
    </div>

    <!-- фикс: подключаем скрипт правильно -->
    <script>
        // переносим содержимое textarea в глобальную переменную
        window._manualM3U = document.getElementById("manualm3u").value;
    </script>
    <script src="runtime.js"></script> <!-- раньше было /js/runtime.js -->

    <script>
        let currentIndex = -1;
        let currentChannels = [];

        function playChannelWithNavigation(channel, index) {
            currentIndex = index;
            currentChannels = window._activeChannels || [];
            const channelNameSpan = document.getElementById("current-channel-name");
            if (channelNameSpan) channelNameSpan.textContent = channel.name || "";
            const videoPlayer = document.getElementById("video-player");
            const playerContainer = document.getElementById("player-container");

            if (window.Hls && window.Hls.isSupported()) {
                const hls = new window.Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(videoPlayer);
                hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
                    videoPlayer.play().catch(()=>{});
                });
            } else if (videoPlayer.canPlayType("application/vnd.apple.mpegurl")) {
                videoPlayer.src = channel.url;
                videoPlayer.play().catch(()=>{});
            } else {
                alert("Your browser cannot play HLS streams.");
            }
            if (playerContainer) playerContainer.style.display = "block";
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("prev").addEventListener("click", () => {
                if (currentChannels.length > 0 && currentIndex > 0) {
                    playChannelWithNavigation(currentChannels[currentIndex - 1], currentIndex - 1);
                }
            });

            document.getElementById("next").addEventListener("click", () => {
                if (currentChannels.length > 0 && currentIndex < currentChannels.length - 1) {
                    playChannelWithNavigation(currentChannels[currentIndex + 1], currentIndex + 1);
                }
            });
        });
    </script>
</body>
</html>
