<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./runtime.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./styles.css">
  <title>IPTV List Checker</title>
</head>

<body>
  <!--navbar-->
  <nav class="navbar navbar-expand-lg navbg">
    <div class="container-fluid px-5 py-2">
      <a class="navbar-brand text-accent" href="#">iPTV List Checker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link text-accent" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link text-accent" href="#">About</a></li>
        </ul>
        <i class="bi bi-patch-check-fill text-white"></i>
        <span class="navbar-text ps-2 text-accent">Checker Version: 0.3</span>
      </div>
    </div>
  </nav>

  <section>
    <div class="container-fluid">
      <div class="container mt-5">
        <h1>iPTV Channel list checker</h1>
        <p>This checks your M3U playlist for active channels in your list.</p>
      </div>
      <div class="container mt-5 border border-dark-subtle border-2 rounded w-75">
        <form class="d-flex mt-3">
          <label for="playlisturl">M3U Link Scan</label>
          <input class="form-control me-2" type="url" id="playlisturl"
            placeholder="https://some.m3uplaylist.com/iptv/channel.m3u">
        </form>
        <div class="mt-3"><p class="text-center">-or-</p></div>
        <div class="mb-3 d-flex">
          <label for="file">M3U File Scan</label>
          <input type="file" class="form-control me-2" id="file" accept=".m3u, .m3u8">
        </div>
        <div class="d-flex gap-2 mb-3 justify-content-between">
          <span id="scind">Finished. Loaded: 0 | Checked: 0 | ✅ Online: 0 | ❌ Offline: 0</span>
          <div>
            <button class="btn btn-warning" type="submit" id="check">Check</button>
            <button class="btn btn-primary" type="button" id="dl">Download</button>
            <button class="btn btn-danger" type="submit" id="clear">Clear</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- прогресс бар -->
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <section>
    <div class="container-fluid w-75" style="max-height: 500px; overflow:auto;">
      <table class="table">
        <thead class="sticky-top">
          <th>#</th>
          <th>Channel Name</th>
          <th>Status</th>
          <th>Response Code</th>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- Плавающий IPTV плеер -->
  <div id="player-container">
    <div class="player-header">
      <button id="close-player">✖</button>
    </div>
    <video id="iptv-player" width="100%" height="250" controls autoplay></video>
  </div>

  <footer class="navbg">
    <div class="container py-5">
      <h6 class="text-center text-accent">
        Made by laziness: Yapmix -
        <a href="https://github.com/Yapmix/iPTV-Scanner">Github</a>
      </h6>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
